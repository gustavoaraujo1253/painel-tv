<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estúdio — Dashboard Gerencial</title>
<style>
:root{
  --page:#0D1828; --card:#15243A; --alto:#1D3253; --trilho:#22385A; --borda:#253348;
  --hi:#EDF2F9; --md:#93A8C4; --lo:#5B7091;
  --bom:#35D07F; --atencao:#FFB324; --critico:#FF5C5C;
  --gap:#3C5578; --chipRuimBg:#3A2D3F;
  --laranja:#FF7A1A; --verde:#22C3A7; --roxo:#8B7BE8; --azul:#3F90DA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--hi);overflow:hidden;
  font:400 15px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

#estudio{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.topo{display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid var(--borda);flex:none}
.marca{width:4px;height:30px;background:var(--laranja);flex:none}
.topo h1{font-size:19px;font-weight:600}
.ciclo{color:var(--lo);font-size:14px;margin-left:auto;white-space:nowrap}
.ciclo b{color:var(--md);font-weight:600}
.bt{border:1px solid var(--borda);padding:9px 16px;color:var(--md);font-size:14px;white-space:nowrap}
.bt:hover{background:var(--alto);color:var(--hi)}
.bt.forte{background:var(--laranja);color:#0D1828;font-weight:600;border-color:var(--laranja)}
.bt.forte:hover{filter:brightness(1.1)}
.bt[disabled]{opacity:.4;cursor:not-allowed;background:none;color:var(--lo)}
.bt.peq{padding:5px 9px;font-size:13px}

.dica{padding:13px 30px;background:var(--card);border-bottom:1px solid var(--borda);color:var(--md);font-size:14px;flex:none;display:flex;align-items:center;gap:14px}
.dica b{color:var(--hi);font-weight:600}
.dica kbd{background:var(--alto);border:1px solid var(--gap);padding:1px 7px;font-size:13px;color:var(--hi)}
.dica.alerta{background:var(--chipRuimBg)}
.dica.alerta b{color:var(--atencao)}
.dica .dir{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--lo);font-size:13px}
.dica input[type=range]{width:130px;accent-color:var(--laranja)}

.painel{flex:1;overflow-y:auto;padding:24px 30px 96px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;max-width:1620px}

.vaga{background:var(--card);border:1px solid var(--borda);display:flex;flex-direction:column;transition:border-color .12s}
.vaga:hover{border-color:var(--gap)}
.vaga.alvo{border-color:var(--cor)}
.vaga.arrasta{border-color:var(--cor);background:var(--alto)}
.moldura{position:relative;aspect-ratio:16/9;background:var(--page);border-bottom:1px solid var(--borda);overflow:hidden;cursor:pointer}
.moldura img{width:100%;height:100%;object-fit:contain;display:block}
.vazia{position:absolute;inset:14px;border:1px dashed var(--trilho);display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;padding:10px}
.vazia span{color:var(--lo);font-size:13px;line-height:1.55}
.vazia .ic{width:26px;height:18px;border:2px solid var(--trilho)}
.pronta{position:absolute;left:0;top:0;background:var(--cor);color:#0D1828;font-size:12px;font-weight:600;padding:4px 10px;z-index:3}
.indice{position:absolute;right:0;top:0;background:rgba(13,24,40,.85);color:var(--lo);font-size:12px;padding:4px 9px;z-index:3}
.qual{position:absolute;right:0;bottom:0;font-size:12px;padding:4px 9px;z-index:3;background:rgba(13,24,40,.88);border-left:1px solid var(--borda);border-top:1px solid var(--borda)}
.qual.ok{color:var(--bom)} .qual.at{color:var(--atencao)} .qual.er{color:var(--critico)}
.trab{position:absolute;inset:0;background:rgba(13,24,40,.9);display:grid;place-content:center;justify-items:center;gap:13px;z-index:4}
.trab span{color:var(--md);font-size:13px}
.pulso{width:120px;height:3px;background:var(--trilho);overflow:hidden}
.pulso i{display:block;width:40%;height:100%;background:var(--laranja);animation:corre 1.1s infinite linear}
@keyframes corre{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

.rodape{padding:13px 15px;display:flex;flex-direction:column;gap:10px}
.linha{display:flex;align-items:center;gap:10px}
.tag{width:3px;height:17px;background:var(--cor);flex:none}
.nome{flex:1;background:none;border:0;border-bottom:1px solid transparent;font-size:15px;font-weight:600;padding:1px 0;min-width:0}
.nome:hover{border-bottom-color:var(--trilho)}
.nome:focus{outline:0;border-bottom-color:var(--cor)}
select.cor{background:var(--page);border:1px solid var(--borda);color:var(--md);font-size:12.5px;padding:4px 6px}
.meta{color:var(--lo);font-size:12.5px;display:flex;align-items:center;gap:7px;min-height:18px;flex-wrap:wrap}
.meta .at{color:var(--atencao)}
.acoes{display:flex;align-items:center;gap:6px}
.passo{display:flex;align-items:center;border:1px solid var(--borda)}
.passo button{width:26px;height:26px;color:var(--md);font-size:15px;line-height:1}
.passo button:hover{background:var(--alto);color:var(--hi)}
.passo span{padding:0 9px;color:var(--md);font-size:13px;min-width:46px;text-align:center}
.espaco{margin-left:auto}
.bt.risco:hover{border-color:var(--critico);color:var(--critico);background:none}

.nova{border:1px dashed var(--trilho);background:none;color:var(--lo);display:grid;place-content:center;justify-items:center;gap:9px;min-height:250px;font-size:14px}
.nova:hover{border-color:var(--gap);color:var(--md)}
.nova .cruz{font-size:22px;line-height:1}

.pe{position:absolute;left:0;right:0;bottom:0;padding:14px 30px;background:linear-gradient(to top,var(--page) 72%,transparent);
  color:var(--lo);font-size:13px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pe code{background:var(--card);border:1px solid var(--borda);padding:2px 7px;font-family:Consolas,monospace;font-size:12px;color:var(--hi)}
.pe button{color:var(--lo);font-size:13px;border-bottom:1px solid transparent}
.pe button:hover{color:var(--critico);border-bottom-color:var(--critico)}

#recado{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(14px);background:var(--alto);
  border:1px solid var(--gap);padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:90;max-width:min(780px,92vw);text-align:center}
#recado.visivel{opacity:1;transform:translateX(-50%) translateY(0)}

/* exibição */
#tv{position:absolute;inset:0;background:#000;display:none}
#tv.on{display:block}
body.exibindo{cursor:none}
#palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;background:var(--page)}
.camada{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .26s linear,visibility 0s .26s}
.camada.ativa{opacity:1;visibility:visible;transition:opacity .26s linear}
.camada img{width:1920px;height:1080px;object-fit:contain;display:block}
#faixa{position:absolute;top:0;left:0;height:5px;width:100%;background:var(--trilho);z-index:20}
#avanco{height:100%;width:0;background:var(--laranja)}
#etiq{position:absolute;left:40px;bottom:34px;z-index:20;display:flex;align-items:center;gap:18px;
  padding:13px 22px 13px 17px;background:rgba(21,36,58,.94);border:1px solid var(--borda);opacity:0;transition:opacity .3s}
#etiq.on{opacity:1}
#etMarca{width:4px;height:27px;background:var(--laranja);flex:none}
#etNome{font-size:23px;font-weight:600}
#etPontos{display:flex;gap:7px}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--lo);opacity:.45}
.ponto.aceso{background:var(--hi);opacity:1}
</style>
</head>
<body>

<section id="estudio">
  <header class="topo">
    <i class="marca"></i>
    <h1>Dashboard Gerencial</h1>
    <span class="ciclo">ciclo de <b id="ciclo">0s</b></span>
    <button class="bt" id="btTV" disabled>Ver na TV agora</button>
    <button class="bt forte" id="btGerar" disabled>Gerar arquivo da TV</button>
  </header>

  <div class="dica" id="dica">
    <span id="dicaTexto"></span>
    <span class="dir">
      nitidez
      <input type="range" id="nit" min="0" max="150" step="10" value="70">
      <b id="nitVal" style="color:var(--md)">70</b>
    </span>
  </div>

  <div class="painel"><div class="grade" id="grade"></div></div>

  <div class="pe">
    <span>Melhor ganho de qualidade: <b style="color:var(--md)">F11</b> no Power BI antes do print, e Windows em escala <code>100%</code>. Print nativo em 1920×1080 dispensa qualquer tratamento.</span>
    <button id="btLimpar">Remover todos os prints</button>
  </div>
</section>

<section id="tv">
  <div id="palco">
    <div id="camadas"></div>
    <div id="faixa"><div id="avanco"></div></div>
    <div id="etiq"><i id="etMarca"></i><span id="etNome"></span><span id="etPontos"></span></div>
  </div>
</section>

<div id="recado"></div>
<input type="file" id="arq" accept="image/*" multiple hidden>

<script>
const CORES = { "#FF7A1A":"laranja", "#22C3A7":"verde", "#8B7BE8":"roxo", "#3F90DA":"azul" };
const PADRAO = [
  { nome:"Overview",     cor:"#FF7A1A", segundos:25 },
  { nome:"Meta e Canal", cor:"#FF7A1A", segundos:20 },
  { nome:"Produto",      cor:"#22C3A7", segundos:20 },
  { nome:"Cliente",      cor:"#8B7BE8", segundos:20 },
  { nome:"Opera\u00E7\u00E3o", cor:"#3F90DA", segundos:20 }
];
const L = 1920, A = 1080, FUNDO = [0x0D,0x18,0x28];

let vagas = [], sel = 0, bd = null, persistente = false, nitidez = 70;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function falar(t){
  const r = $('recado'); r.innerHTML = t; r.classList.add('visivel');
  clearTimeout(falar.t); falar.t = setTimeout(() => r.classList.remove('visivel'), 3600);
}

/* ═══════════ armazenamento ═══════════ */
function abrirBanco(){
  return new Promise((ok,fa) => {
    if (!('indexedDB' in window)) return fa();
    const r = indexedDB.open('estudio-tv',1);
    r.onupgradeneeded = e => { const b = e.target.result;
      if (!b.objectStoreNames.contains('v')) b.createObjectStore('v',{keyPath:'id'});
      if (!b.objectStoreNames.contains('cfg')) b.createObjectStore('cfg',{keyPath:'k'}); };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fa(r.error);
  });
}
function gravar(){
  if (!persistente) return;
  try{
    const t = bd.transaction(['v','cfg'],'readwrite');
    const st = t.objectStore('v'); st.clear();
    vagas.forEach((v,i) => st.put({ id:v.id, ordem:i, nome:v.nome, cor:v.cor, segundos:v.segundos,
      bruto:v.bruto||null, tratado:v.tratado||null, origL:v.origL||0, origA:v.origA||0,
      cortou:!!v.cortou, quando:v.quando||null }));
    t.objectStore('cfg').put({ k:'nitidez', v:nitidez });
  } catch(e){ persistente = false; }
}
function lerTudo(){
  return new Promise(ok => {
    try{
      const t = bd.transaction(['v','cfg'],'readonly');
      const a = t.objectStore('v').getAll();
      const c = t.objectStore('cfg').get('nitidez');
      a.onsuccess = () => { c.onsuccess = () => ok({ vagas:a.result.sort((x,y)=>x.ordem-y.ordem), nit:c.result?c.result.v:70 });
                            c.onerror = () => ok({ vagas:a.result.sort((x,y)=>x.ordem-y.ordem), nit:70 }); };
      a.onerror = () => ok({ vagas:[], nit:70 });
    } catch(e){ ok({ vagas:[], nit:70 }); }
  });
}
const idNovo = () => 'v' + Math.random().toString(36).slice(2,9);

/* ═══════════ TRATAMENTO DA IMAGEM ═══════════
   1. corta a rebarba lisa em volta do conteúdo
   2. amplia para 1920×1080 com interpolação de alta qualidade
   3. máscara de nitidez para recuperar a borda do texto
   Nenhum pixel do conteúdo é reposicionado ou recolorido além disso. */

function cortarRebarba(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d',{ willReadFrequently:true });
  if (!ctx || !ctx.getImageData) return { canvas:c, cortou:false };
  ctx.drawImage(img,0,0);
  let d;
  try { d = ctx.getImageData(0,0,c.width,c.height).data; } catch(e){ return { canvas:c, cortou:false }; }
  const w = c.width, h = c.height, tol = 18;
  const px = (x,y) => { const i = (y*w+x)*4; return [d[i],d[i+1],d[i+2]]; };
  const ig = (a,b) => Math.abs(a[0]-b[0])<=tol && Math.abs(a[1]-b[1])<=tol && Math.abs(a[2]-b[2])<=tol;
  const base = px(0,0);
  const lisaL = y => { for (let x=0;x<w;x+=2) if (!ig(px(x,y),base)) return false; return true; };
  const lisaC = x => { for (let y=0;y<h;y+=2) if (!ig(px(x,y),base)) return false; return true; };
  let t=0,b=h-1,e=0,r=w-1;
  while (t<b && lisaL(t)) t++;
  while (b>t && lisaL(b)) b--;
  while (e<r && lisaC(e)) e++;
  while (r>e && lisaC(r)) r--;
  const nl = r-e+1, na = b-t+1;
  if (nl < 60 || na < 60) return { canvas:c, cortou:false };
  const rec = document.createElement('canvas');
  rec.width = nl; rec.height = na;
  rec.getContext('2d').drawImage(c, e,t,nl,na, 0,0,nl,na);
  return { canvas:rec, cortou:(nl !== w || na !== h) };
}

function mascaraNitidez(ctx, w, h, forca){
  if (forca <= 0 || !ctx.getImageData || !ctx.putImageData) return false;
  let img;
  try { img = ctx.getImageData(0,0,w,h); } catch(e){ return false; }
  const d = img.data;
  const n = d.length;
  const tmp = new Uint8ClampedArray(n), bl = new Uint8ClampedArray(n);
  for (let y=0;y<h;y++){
    const base = y*w;
    for (let x=0;x<w;x++){
      const i = (base+x)*4;
      const a = (base + (x>0?x-1:x))*4, b = (base + (x<w-1?x+1:x))*4;
      tmp[i]   = (d[a]  +d[i]  +d[b])/3;
      tmp[i+1] = (d[a+1]+d[i+1]+d[b+1])/3;
      tmp[i+2] = (d[a+2]+d[i+2]+d[b+2])/3;
    }
  }
  for (let y=0;y<h;y++){
    const y0 = (y>0?y-1:y)*w, y2 = (y<h-1?y+1:y)*w, yc = y*w;
    for (let x=0;x<w;x++){
      const i = (yc+x)*4, a = (y0+x)*4, b = (y2+x)*4;
      bl[i]   = (tmp[a]  +tmp[i]  +tmp[b])/3;
      bl[i+1] = (tmp[a+1]+tmp[i+1]+tmp[b+1])/3;
      bl[i+2] = (tmp[a+2]+tmp[i+2]+tmp[b+2])/3;
    }
  }
  for (let i=0;i<n;i+=4){
    for (let c=0;c<3;c++){
      const v = d[i+c] + forca*(d[i+c]-bl[i+c]);
      d[i+c] = v < 0 ? 0 : (v > 255 ? 255 : v);
    }
  }
  ctx.putImageData(img,0,0);
  return true;
}

function paraBlob(canvas){
  return new Promise(ok => {
    let f = false; const fim = b => { if (!f){ f = true; ok(b); } };
    try { canvas.toBlob(fim,'image/png'); } catch(e){ fim(null); }
    setTimeout(() => fim(null), 6000);
  });
}

async function tratar(brutoBlob){
  const u = URL.createObjectURL(brutoBlob);
  const img = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = u; });
  if (!img){ URL.revokeObjectURL(u); return null; }
  const origL = img.naturalWidth, origA = img.naturalHeight;

  const { canvas:cortado, cortou } = cortarRebarba(img);
  URL.revokeObjectURL(u);

  const alvo = document.createElement('canvas');
  alvo.width = L; alvo.height = A;
  const ctx = alvo.getContext('2d');
  ctx.fillStyle = 'rgb(' + FUNDO.join(',') + ')';
  ctx.fillRect(0,0,L,A);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const f = Math.min(L/cortado.width, A/cortado.height);
  const dw = Math.round(cortado.width*f), dh = Math.round(cortado.height*f);
  const dx = Math.round((L-dw)/2), dy = Math.round((A-dh)/2);

  if (f > 1.25){
    // ampliação em dois passos preserva mais detalhe que um salto único
    const meio = document.createElement('canvas');
    meio.width = Math.round(cortado.width*Math.sqrt(f));
    meio.height = Math.round(cortado.height*Math.sqrt(f));
    const mc = meio.getContext('2d');
    mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
    mc.drawImage(cortado,0,0,meio.width,meio.height);
    ctx.drawImage(meio, dx,dy,dw,dh);
  } else {
    ctx.drawImage(cortado, dx,dy,dw,dh);
  }

  const nitOk = nitidez > 0 ? mascaraNitidez(ctx, L, A, nitidez/100) : true;

  const blob = await paraBlob(alvo);
  return { blob, origL, origA, cortou, fator:f, nitOk };
}

async function processar(indice, brutoBlob){
  const v = vagas[indice];
  if (!v) return;
  v.trabalhando = true; pintar();
  const r = await tratar(brutoBlob || v.bruto);
  v.trabalhando = false;
  if (!r || !r.blob){ falar('N\u00E3o consegui tratar essa imagem.'); pintar(); return; }
  if (brutoBlob) v.bruto = brutoBlob;
  if (v.url) URL.revokeObjectURL(v.url);
  v.tratado = r.blob; v.url = URL.createObjectURL(r.blob);
  v.origL = r.origL; v.origA = r.origA; v.cortou = r.cortou; v.fator = r.fator; v.nitOk = r.nitOk;
  if (brutoBlob) v.quando = Date.now();
  gravar(); pintar();
}

async function receber(blobs, inicio){
  let i = inicio, n = 0;
  for (const b of blobs){
    if (i >= vagas.length) break;
    if (!b.type.startsWith('image/')) continue;
    await processar(i, b); n++; i++;
  }
  if (!n) return;
  sel = Math.min(i, vagas.length-1);
  pintar();
  falar(n + ' print tratado e pronto. Rebarba cortada, ampliado para 1920\u00D71080 e com nitidez aplicada.');
}

/* ═══════════ tela ═══════════ */
function avaliar(v){
  if (!v.tratado) return null;
  const f = v.fator || 1;
  if (f <= 1.05) return { c:'ok', t:'nativo' };
  if (f <= 1.4)  return { c:'ok', t:'ampliado ' + f.toFixed(2) + '\u00D7' };
  if (f <= 1.9)  return { c:'at', t:'ampliado ' + f.toFixed(2) + '\u00D7' };
  return { c:'er', t:'ampliado ' + f.toFixed(2) + '\u00D7' };
}

function pintar(){
  const grade = $('grade');
  grade.innerHTML = '';

  vagas.forEach((v,i) => {
    const el = document.createElement('article');
    el.className = 'vaga' + (i === sel ? ' alvo' : '');
    el.style.setProperty('--cor', v.cor);

    const m = document.createElement('div');
    m.className = 'moldura';
    if (v.url){
      const im = document.createElement('img'); im.src = v.url; im.alt = v.nome; m.appendChild(im);
      const q = avaliar(v);
      if (q) m.insertAdjacentHTML('beforeend','<span class="qual ' + q.c + '">' + q.t + '</span>');
    } else {
      m.insertAdjacentHTML('beforeend',
        '<div class="vazia"><i class="ic"></i><span>Cole o print com Ctrl+V<br>ou solte o arquivo aqui</span></div>');
    }
    m.insertAdjacentHTML('beforeend','<span class="indice">' + (i+1) + '</span>');
    if (i === sel) m.insertAdjacentHTML('beforeend','<span class="pronta">pronta para colar</span>');
    if (v.trabalhando) m.insertAdjacentHTML('beforeend',
      '<div class="trab"><span class="pulso"><i></i></span><span>cortando e ampliando\u2026</span></div>');
    m.onclick = () => { sel = i; pintar(); $('arq').click(); };

    ['dragenter','dragover'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add('arrasta'); }));
    ['dragleave','drop'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('arrasta')));
    el.addEventListener('drop', e => { e.preventDefault();
      receber([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')), i); });

    const rp = document.createElement('div');
    rp.className = 'rodape';
    const l1 = document.createElement('div');
    l1.className = 'linha';
    l1.innerHTML = '<i class="tag"></i>';
    const nm = document.createElement('input');
    nm.className = 'nome'; nm.value = v.nome; nm.spellcheck = false;
    nm.onchange = () => { v.nome = nm.value.trim() || v.nome; gravar(); pintar(); };
    nm.onkeydown = e => { if (e.key === 'Enter') nm.blur(); };
    l1.appendChild(nm);
    const sc = document.createElement('select');
    sc.className = 'cor';
    Object.keys(CORES).forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = CORES[c];
      if (v.cor === c) o.selected = true; sc.appendChild(o);
    });
    sc.onchange = () => { v.cor = sc.value; gravar(); pintar(); };
    l1.appendChild(sc);
    rp.appendChild(l1);

    const mt = document.createElement('div');
    mt.className = 'meta';
    if (v.tratado){
      const p = ['<span>print ' + v.origL + '\u00D7' + v.origA + (v.cortou ? ' \u00B7 rebarba cortada' : '') + '</span>'];
      p.push('<span>\u2192 1920\u00D71080</span>');
      if (v.quando) p.push('<span>' + new Date(v.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) + '</span>');
      if ((v.fator||1) > 1.9) p.push('<span class="at">capture em tela cheia para ganho real</span>');
      mt.innerHTML = p.join('<span>\u00B7</span>');
    } else {
      mt.innerHTML = '<span>sem print</span>';
    }
    rp.appendChild(mt);

    const ac = document.createElement('div');
    ac.className = 'acoes';
    ac.innerHTML =
      '<div class="passo"><button data-a="menos">\u2212</button><span>' + v.segundos + 's</span><button data-a="mais">+</button></div>' +
      (v.bruto ? '<button class="bt peq" data-a="retratar">Retratar</button>' : '') +
      '<button class="bt peq" data-a="antes"' + (i===0?' disabled':'') + '>\u25C0</button>' +
      '<button class="bt peq" data-a="depois"' + (i===vagas.length-1?' disabled':'') + '>\u25B6</button>' +
      '<button class="bt peq risco espaco" data-a="del">\u00D7</button>';
    ac.onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === 'menos') v.segundos = Math.max(5, v.segundos-5);
      if (a === 'mais')  v.segundos = Math.min(120, v.segundos+5);
      if (a === 'retratar') return processar(i, null);
      if (a === 'antes'){ vagas.splice(i-1,0,vagas.splice(i,1)[0]); sel = i-1; }
      if (a === 'depois'){ vagas.splice(i+1,0,vagas.splice(i,1)[0]); sel = i+1; }
      if (a === 'del'){ if (v.url) URL.revokeObjectURL(v.url); vagas.splice(i,1); sel = Math.max(0,Math.min(sel,vagas.length-1)); }
      gravar(); pintar();
    };
    rp.appendChild(ac);

    el.appendChild(m); el.appendChild(rp);
    grade.appendChild(el);
  });

  const nv = document.createElement('button');
  nv.className = 'nova';
  nv.innerHTML = '<span class="cruz">+</span><span>Adicionar p\u00E1gina</span>';
  nv.onclick = () => {
    const cs = Object.keys(CORES);
    vagas.push({ id:idNovo(), nome:'Nova p\u00E1gina', cor:cs[vagas.length % cs.length], segundos:20 });
    sel = vagas.length-1; gravar(); pintar();
  };
  grade.appendChild(nv);

  const prontas = vagas.filter(v => v.tratado);
  $('ciclo').textContent = prontas.reduce((s,v) => s+v.segundos, 0) + 's';
  $('btTV').disabled = !prontas.length;
  $('btGerar').disabled = !prontas.length;

  const d = $('dica');
  const ruins = prontas.filter(v => (v.fator||1) > 1.9).length;
  d.classList.remove('alerta');
  if (!persistente){
    d.classList.add('alerta');
    $('dicaTexto').innerHTML = '<b>Este navegador n\u00E3o guarda dados.</b> Os prints somem ao recarregar. Gere o arquivo da TV antes de fechar.';
  } else if (ruins){
    d.classList.add('alerta');
    $('dicaTexto').innerHTML = '<b>' + ruins + ' print sendo ampliado mais de 1,9\u00D7.</b> O tratamento ajuda, mas capturar em tela cheia resolve de verdade.';
  } else {
    $('dicaTexto').innerHTML = 'Cole o print com <kbd>Ctrl</kbd>+<kbd>V</kbd> na vaga marcada \u2014 a rebarba \u00E9 cortada, a imagem vai para 1920\u00D71080 e ganha nitidez. Depois clique em <b>Gerar arquivo da TV</b>.';
  }
}

addEventListener('paste', e => {
  const f = document.activeElement;
  if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA')) return;
  const it = [...((e.clipboardData && e.clipboardData.items)||[])].filter(i => i.type.startsWith('image/'));
  if (!it.length) return;
  e.preventDefault();
  receber(it.map(i => i.getAsFile()).filter(Boolean), sel);
});
['dragover','drop'].forEach(ev => addEventListener(ev, e => e.preventDefault()));
$('arq').onchange = e => { receber([...e.target.files], sel); e.target.value = ''; };
$('btLimpar').onclick = () => {
  vagas.forEach(v => { if (v.url) URL.revokeObjectURL(v.url);
    delete v.url; delete v.bruto; delete v.tratado; delete v.quando; delete v.origL; delete v.origA; delete v.fator; });
  gravar(); pintar(); falar('Prints removidos. As vagas continuam.');
};

$('nit').onchange = async () => {

  if (!alvos.length) return;
  falar('Reaplicando nitidez em ' + alvos.length + ' print\u2026');

};

/* ═══════════ exibição local ═══════════ */
let fila = [], atual = 0, t0 = 0, dec = 0, raf = null, tEt = null;
const exibindo = () => document.body.classList.contains('exibindo');
function escala(){
  const s = Math.min(innerWidth/L, innerHeight/A);
  const f = Date.now()/420000*Math.PI*2;
  const dx = Math.round(Math.sin(f)*3), dy = Math.round(Math.cos(f*0.73)*3);
  $('palco').style.transform = 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
}
addEventListener('resize', () => { if (exibindo()) escala(); });
setInterval(() => { if (exibindo()) escala(); }, 20000);

async function verTV(){
  fila = vagas.filter(v => v.url);
  if (!fila.length) return;
  $('camadas').innerHTML = ''; $('etPontos').innerHTML = '';
  fila.forEach(v => {
    const c = document.createElement('div'); c.className = 'camada';
    const im = document.createElement('img'); im.src = v.url; im.draggable = false;
    c.appendChild(im); $('camadas').appendChild(c);
    const p = document.createElement('i'); p.className = 'ponto'; $('etPontos').appendChild(p);
  });
  $('estudio').style.display = 'none';
  $('tv').classList.add('on');
  document.body.classList.add('exibindo');
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  try { if ('wakeLock' in navigator) verTV.trava = await navigator.wakeLock.request('screen'); } catch(e){}
  escala(); ir(0); cancelAnimationFrame(raf); girar();
}
function sair(){
  cancelAnimationFrame(raf); raf = null; clearTimeout(tEt);
  try { if (verTV.trava){ verTV.trava.release(); verTV.trava = null; } } catch(e){}
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('tv').classList.remove('on');
  document.body.classList.remove('exibindo');
  $('estudio').style.display = 'flex';
  pintar();
}
function ir(i){
  atual = (i + fila.length) % fila.length;
  const v = fila[atual];
  [...$('camadas').children].forEach((c,k) => c.classList.toggle('ativa', k === atual));
  [...$('etPontos').children].forEach((p,k) => p.classList.toggle('aceso', k === atual));
  $('avanco').style.background = v.cor; $('etMarca').style.background = v.cor;
  $('etNome').textContent = v.nome;
  $('etiq').classList.add('on');
  clearTimeout(tEt); tEt = setTimeout(() => $('etiq').classList.remove('on'), 3500);
  dec = 0; t0 = performance.now();
}
function girar(){
  raf = requestAnimationFrame(girar);
  const a = performance.now(); dec += a - t0; t0 = a;
  const dur = (fila[atual].segundos||20)*1000;
  $('avanco').style.width = Math.min(100, dec/dur*100) + '%';
  if (dec >= dur) ir(atual+1);
}
$('btTV').onclick = verTV;
addEventListener('keydown', e => {
  if (!exibindo()) return;
  if (e.key === 'ArrowRight') ir(atual+1);
  else if (e.key === 'ArrowLeft') ir(atual-1);
  else if (e.key === 'Escape') sair();
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && exibindo()) sair(); });

/* ═══════════ gerar o arquivo da TV ═══════════ */
function dataURL(blob){
  return new Promise((ok,fa) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result));
    r.onerror = () => fa(new Error('leitura'));
    r.readAsDataURL(blob);
  });
}

(async function(){
  try{
    bd = await abrirBanco(); persistente = true;
    const r = await lerTudo();
    nitidez = r.nit; $('nit').value = nitidez; $('nitVal').textContent = nitidez;

      id:x.id, nome:x.nome, cor:x.cor, segundos:x.segundos,
      bruto:x.bruto||undefined, tratado:x.tratado||undefined,
      url:x.tratado ? URL.createObjectURL(x.tratado) : undefined,
      origL:x.origL, origA:x.origA, cortou:x.cortou, quando:x.quando||undefined,
      fator: x.origL ? Math.min(1920/x.origL, 1080/x.origA) : 1
    }));
  } catch(e){ persistente = false; }
  if (!vagas.length) vagas = PADRAO.map(v => Object.assign({ id:idNovo() }, v));
  pintar();
})();
