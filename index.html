<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Gerencial — TV</title>
<style>
:root{
  --page:#0D1828; --card:#15243A; --alto:#1D3253; --trilho:#22385A; --borda:#253348;
  --hi:#EDF2F9; --md:#93A8C4; --lo:#5B7091;
  --bom:#35D07F; --atencao:#FFB324; --critico:#FF5C5C;
  --gap:#3C5578; --chipBomBg:#1A4045; --chipRuimBg:#3A2D3F;
  --laranja:#FF7A1A; --verde:#22C3A7; --roxo:#8B7BE8; --azul:#3F90DA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--hi);overflow:hidden;
  font:400 15px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

/* ═══ PAINEL DE CONTROLE ═══ */
#controle{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.topo{display:flex;align-items:center;gap:20px;padding:20px 32px;border-bottom:1px solid var(--borda);flex:none}
.marca{width:4px;height:30px;background:var(--laranja);flex:none}
.titulo{font-size:19px;font-weight:600}
.ciclo{color:var(--lo);font-size:14px;margin-left:auto;white-space:nowrap}
.ciclo b{color:var(--md);font-weight:600}
.exibir{background:var(--laranja);color:#0D1828;font-weight:600;padding:10px 22px;display:flex;align-items:center;gap:10px;transition:filter .12s}
.exibir:hover{filter:brightness(1.1)}
.exibir:disabled{background:var(--trilho);color:var(--lo);cursor:not-allowed;filter:none}
.exibir i{width:0;height:0;border:6px solid transparent;border-left:9px solid currentColor;border-right:0}

.aviso{padding:13px 32px;background:var(--card);border-bottom:1px solid var(--borda);color:var(--md);font-size:14px;flex:none;display:flex;align-items:center;gap:14px}
.aviso b{color:var(--hi);font-weight:600}
.aviso.alerta{background:var(--chipRuimBg)}
.aviso.alerta b{color:var(--atencao)}
.aviso .dir{margin-left:auto;display:flex;gap:14px;align-items:center}
.aviso button{color:var(--md);font-size:13px;border-bottom:1px solid var(--trilho)}
.aviso button:hover{color:var(--hi);border-bottom-color:var(--hi)}

.corpo{flex:1;overflow-y:auto;padding:26px 32px 40px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;max-width:1600px}
.cartao{background:var(--card);border:1px solid var(--borda)}
.moldura{position:relative;aspect-ratio:16/9;background:var(--page);border-bottom:1px solid var(--borda);overflow:hidden}
.mini{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
.indice{position:absolute;right:0;top:0;background:rgba(13,24,40,.82);color:var(--lo);font-size:12px;padding:4px 9px;z-index:3}
.rodape{padding:13px 16px;display:flex;align-items:center;gap:10px}
.tag{width:3px;height:18px;background:var(--cor);flex:none}
.nome{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempo{color:var(--lo);font-size:13px}

.vazio{max-width:560px;margin:60px auto;text-align:center;color:var(--md)}
.vazio h2{font-size:20px;color:var(--hi);margin-bottom:12px}
.vazio p{font-size:14px;line-height:1.7}
.vazio code{background:var(--card);border:1px solid var(--borda);padding:2px 7px;font-family:Consolas,monospace;font-size:13px;color:var(--hi)}

/* ═══ GAVETA DE DADOS ═══ */
#gaveta{position:fixed;inset:0;background:rgba(6,12,22,.74);display:none;z-index:60}
#gaveta.aberta{display:block}
.painel{position:absolute;right:0;top:0;bottom:0;width:min(760px,96vw);background:var(--card);border-left:1px solid var(--borda);display:flex;flex-direction:column}
.painel-topo{padding:18px 24px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;flex:none}
.painel-topo h2{font-size:17px;font-weight:600}
.painel-topo .sub{color:var(--lo);font-size:13px}
.fechar{margin-left:auto;color:var(--md);font-size:20px;padding:2px 8px}
.fechar:hover{color:var(--hi)}
.painel-corpo{flex:1;overflow:auto;padding:18px 24px}
#json{width:100%;height:100%;min-height:460px;background:var(--page);border:1px solid var(--borda);padding:12px;
  font-family:Consolas,ui-monospace,monospace;font-size:12.5px;line-height:1.6;resize:none;white-space:pre}
#json:focus{outline:0;border-color:var(--gap)}
.painel-pe{padding:14px 24px;border-top:1px solid var(--borda);display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
.bt{border:1px solid var(--borda);padding:8px 14px;color:var(--md);font-size:14px}
.bt:hover{background:var(--alto);color:var(--hi)}
.bt.forte{background:var(--laranja);color:#0D1828;font-weight:600;border-color:var(--laranja)}
.bt.forte:hover{filter:brightness(1.1);background:var(--laranja)}
#erro{color:var(--critico);font-size:13px;width:100%;display:none}

#recado{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);background:var(--alto);
  border:1px solid var(--gap);padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:90;max-width:min(700px,90vw);text-align:center}
#recado.visivel{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ EXIBIÇÃO ═══ */
#exibicao{position:absolute;inset:0;background:#000;display:none}
#exibicao.ligada{display:block}
body.exibindo{cursor:none}
#palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;background:var(--page)}
.camada{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .26s linear,visibility 0s .26s}
.camada.ativa{opacity:1;visibility:visible;transition:opacity .26s linear}
#faixa{position:absolute;top:0;left:0;height:5px;width:100%;background:var(--trilho);z-index:20}
#avanco{height:100%;width:0;background:var(--laranja)}
#etiqueta{position:absolute;left:40px;bottom:34px;z-index:20;display:flex;align-items:center;gap:18px;
  padding:13px 22px 13px 17px;background:rgba(21,36,58,.94);border:1px solid var(--borda);opacity:0;transition:opacity .3s}
#etiqueta.visivel{opacity:1}
#etMarca{width:4px;height:27px;background:var(--laranja);flex:none}
#etNome{font-size:23px;font-weight:600}
#etData{color:var(--lo);font-size:17px}
#etPontos{display:flex;gap:7px}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--lo);opacity:.45}
.ponto.aceso{background:var(--hi);opacity:1}

/* ═══════════ RENDERIZADOR ═══════════ */
.dl{width:1920px;height:1080px;background:var(--page);position:relative;display:flex;flex-direction:column;padding:0 26px 24px;overflow:hidden}
.dl-rail{position:absolute;left:0;right:0;top:0;height:4px;background:var(--id,var(--laranja))}
.dl-head{height:74px;margin-top:4px;display:flex;align-items:center;gap:16px;flex:none}
.dl-logo{width:42px;height:42px;border:2px solid var(--md);border-radius:50%;display:grid;place-content:center;flex:none}
.dl-logo i{width:13px;height:13px;border:2px solid var(--hi);border-radius:50%;display:block}
.dl-marca{font-size:20px;font-weight:600;line-height:1.2}
.dl-pagina{font-size:24px;font-weight:700;color:var(--id,var(--laranja));line-height:1.15}
.dl-head-dir{margin-left:auto;display:flex;align-items:center;gap:18px}
.dl-atu{font-size:19px;color:var(--md)}
.dl-atu b{color:var(--hi);font-weight:600}
.dl-chipmes{font-size:19px;font-weight:600;border:1px solid var(--gap);background:var(--alto);padding:6px 20px}
.dl-corpo{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.dl-faixa{display:flex;gap:12px;min-height:0}
.dl-card{background:var(--card);border:1px solid var(--borda);padding:16px 20px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.dl-card.alto{background:var(--alto)}
.dl-tit{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;margin-bottom:8px;border-bottom:1px solid var(--borda);flex:none}
.dl-tit h4{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-tit span{font-size:16px;color:var(--lo);white-space:nowrap}
.dl-rot{font-size:20px;color:var(--md);line-height:1.2}
.dl-sub{font-size:16px;color:var(--lo)}
.dl-kpi{justify-content:space-between}
.dl-kpi-topo{display:flex;align-items:flex-start;gap:10px}
.dl-kpi-topo .dl-rot{flex:1;min-width:0}
.dl-ic{width:34px;height:34px;background:var(--id,var(--laranja));color:#0D1828;display:grid;place-content:center;font-size:18px;font-weight:700;flex:none}
.dl-valor{font-size:52px;font-weight:600;line-height:1;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-kpi-pe{display:flex;align-items:center;gap:9px;min-height:28px;overflow:hidden}
.dl-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:17px;font-weight:600;white-space:nowrap;flex:none}
.dl-chip.bom{background:var(--chipBomBg);color:var(--bom)}
.dl-chip.ruim{background:var(--chipRuimBg);color:var(--critico)}
.dl-chip.neutro{background:var(--trilho);color:var(--md)}
.dl-selo{display:inline-flex;align-items:center;gap:7px;font-size:17px;color:var(--md);white-space:nowrap}
.dl-selo i{width:11px;height:11px;flex:none;display:block}
.dl-selo b{color:var(--hi);font-weight:600;font-size:18px}
.dl-meta{flex-direction:row;align-items:center;gap:28px;padding:0 26px}
.dl-meta-esq{width:290px;flex:none;display:flex;flex-direction:column;gap:5px;min-width:0}
.dl-valorG{font-size:47px;font-weight:600;letter-spacing:-.5px;line-height:1;white-space:nowrap}
.dl-meta-centro{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.dl-barra{height:50px;display:flex;background:var(--trilho);overflow:hidden}
.dl-barra .seg{display:grid;place-content:center;font-size:18px;font-weight:700;font-style:italic;min-width:0;overflow:hidden;white-space:nowrap}
.dl-leg{display:flex;gap:24px;font-size:16px;color:var(--md)}
.dl-leg span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dl-leg i{width:11px;height:11px;flex:none;display:block}
.dl-meta-dir{width:190px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.dl-grande{font-size:55px;font-weight:700;line-height:1;letter-spacing:-1px}
.dl-itens{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0;overflow:hidden}
.dl-item{display:flex;align-items:center;gap:14px;min-height:0}
.dl-item .nm{flex:0 0 34%;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-item .tr{flex:1;height:17px;background:var(--trilho);min-width:0;display:block}
.dl-item .br{height:100%;display:block}
.dl-item .vl{flex:none;min-width:120px;text-align:right;font-size:20px;font-weight:600;white-space:nowrap}
.dl-item .vr{flex:none;min-width:84px;text-align:right;font-size:19px;font-weight:700;white-space:nowrap}
.dl-item .vr.pos{color:var(--bom)}
.dl-item .vr.neg{color:var(--critico)}
.dl-item .vr.neu{color:var(--md)}
.dl-cols{flex:1;display:flex;align-items:flex-end;gap:8px;min-height:0}
.dl-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.dl-col .cv{font-size:16px;font-weight:600;white-space:nowrap}
.dl-col .cb{width:100%;background:var(--verde);min-height:2px}
.dl-col .cn{font-size:13px;color:var(--md);text-align:center;line-height:1.2;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none;height:32px}
.dl-grade{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0}
.dl-gl{display:flex;gap:5px;flex:1;align-items:stretch;min-height:0}
.dl-gl.cab{flex:none;height:32px}
.dl-rh{width:120px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-size:19px;font-weight:600;color:var(--md);white-space:nowrap;overflow:hidden}
.dl-ch{flex:1;display:grid;place-content:center;font-size:18px;color:var(--md);min-width:0;overflow:hidden;white-space:nowrap}
.dl-cel{flex:1;display:grid;place-content:center;font-size:24px;font-weight:600;min-width:0}
.dl-tab{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dl-tl{display:flex;align-items:center;gap:12px;flex:1;min-height:0;border-bottom:1px solid var(--borda)}
.dl-tl.cab{flex:none;height:34px;border-bottom:1px solid var(--gap)}
.dl-tl.cab span{font-size:16px;color:var(--md)}
.dl-tl span{flex:1;font-size:19px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-tl span.dir{text-align:right}
.dl-lista{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0;overflow:hidden}
.dl-ll{display:flex;align-items:center;gap:12px;font-size:20px}
.dl-ll .r{flex:1;color:var(--md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-ll .v{font-weight:600;white-space:nowrap}
.dl-svg{flex:1;min-height:0;width:100%}
.dl-falta{color:var(--atencao);font-weight:700}
</style>
</head>
<body>

<section id="controle">
  <header class="topo">
    <i class="marca"></i>
    <h1 class="titulo">Dashboard Gerencial</h1>
    <span class="ciclo">ciclo de <b id="ciclo">0s</b></span>
    <button class="exibir" id="btExibir" disabled><i></i>Exibir na TV</button>
  </header>
  <div class="aviso" id="aviso">
    <span id="avisoTexto">carregando…</span>
    <span class="dir">
      <button id="btAtualizar">buscar atualização</button>
      <button id="btDados">ver / colar dados</button>
    </span>
  </div>
  <div class="corpo"><div class="grade" id="grade"></div></div>
</section>

<div id="gaveta">
  <div class="painel">
    <div class="painel-topo">
      <div><h2>Dados dos painéis</h2><div class="sub">É o conteúdo do arquivo <b>paineis.json</b>.</div></div>
      <button class="fechar" id="btFechar">×</button>
    </div>
    <div class="painel-corpo"><textarea id="json" spellcheck="false"></textarea></div>
    <div class="painel-pe">
      <button class="bt forte" id="btCopiar">Copiar tudo</button>
      <button class="bt" id="btAplicar">Ver aqui sem publicar</button>
      <button class="bt" id="btRecarregar">Descartar e recarregar do site</button>
      <div id="erro"></div>
    </div>
  </div>
</div>

<section id="exibicao">
  <div id="palco">
    <div id="camadas"></div>
    <div id="faixa"><div id="avanco"></div></div>
    <div id="etiqueta">
      <i id="etMarca"></i><span id="etNome"></span><span id="etData"></span><span id="etPontos"></span>
    </div>
  </div>
</section>

<div id="recado"></div>

<script>
const OPCOES = { etiquetaSegundos:3.5, antiBurnIn:true, buscarACadaMin:10 };
const IDENT = { "#FF7A1A":1, "#22C3A7":1, "#8B7BE8":1, "#3F90DA":1 };

/* ─────────── renderizador ─────────── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tomCor = t => ({hi:'var(--hi)',md:'var(--md)',bom:'var(--bom)',atencao:'var(--atencao)',critico:'var(--critico)'}[t] || 'var(--hi)');
const rot = s => { const v = esc(s); return v === '?' ? '<span class="dl-falta">?</span>' : v; };
function mistura(a,b,t){
  const h = c => [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const A = h(a), B = h(b), m = i => Math.round(A[i] + (B[i]-A[i])*t);
  return 'rgb(' + m(0) + ',' + m(1) + ',' + m(2) + ')';
}
const escuro = c => {
  const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
  return (r*0.299 + g*0.587 + b*0.114) > 150 ? '#0D1828' : '#EDF2F9';
};
const tit = b => (b.titulo || b.sub)
  ? '<div class="dl-tit"><h4>' + esc(b.titulo||'') + '</h4>' + (b.sub ? '<span>' + esc(b.sub) + '</span>' : '') + '</div>' : '';

function blocoKpi(b){
  let pe = '';
  if (b.selos && b.selos.length){
    pe = b.selos.map(s => '<span class="dl-selo"><i style="background:' + tomCor(s.cor) + '"></i>' + esc(s.rot) + ': <b>' + rot(s.vl) + '</b></span>').join('');
  } else if (b.chip){
    pe = '<span class="dl-chip ' + esc(b.chipTom || 'neutro') + '">' + rot(b.chip) + '</span>' + (b.texto ? '<span class="dl-sub">' + esc(b.texto) + '</span>' : '');
  } else if (b.texto){ pe = '<span class="dl-sub">' + esc(b.texto) + '</span>'; }
  return '<div class="dl-card dl-kpi' + (b.destaque ? ' alto' : '') + '" style="flex:' + (b.peso||1) + '">' +
    '<div class="dl-kpi-topo"><span class="dl-rot">' + esc(b.rotulo) + '</span>' +
    (b.icone ? '<i class="dl-ic">' + esc(b.icone) + '</i>' : '') + '</div>' +
    '<div class="dl-valor" style="color:' + tomCor(b.tom) + '">' + rot(b.valor) + '</div>' +
    '<div class="dl-kpi-pe">' + pe + '</div></div>';
}
function blocoMeta(b){
  const segs = b.segmentos || [];
  const barra = segs.map(s => '<span class="seg" style="flex:' + (Number(s.valor)||1) + ';background:' + esc(s.cor||'#3C5578') +
    ';color:' + escuro(s.cor||'#3C5578') + '">' + rot(s.rotulo) + '</span>').join('');
  const leg = segs.filter(s => s.nome).map(s => '<span><i style="background:' + esc(s.cor) + '"></i>' + esc(s.nome) + '</span>').join('');
  const dir = b.direita || {};
  return '<div class="dl-card dl-meta" style="flex:' + (b.peso||1) + '">' +
    '<div class="dl-meta-esq"><span class="dl-rot">' + esc(b.rotulo) + '</span><span class="dl-valorG">' + rot(b.valor) + '</span></div>' +
    '<div class="dl-meta-centro"><div class="dl-barra">' + barra + '</div><div class="dl-leg">' + leg + '</div></div>' +
    '<div class="dl-meta-dir"><span class="dl-rot">' + esc(dir.rotulo||'') + '</span>' +
    '<span class="dl-grande" style="color:' + tomCor(dir.tom) + '">' + rot(dir.valor) + '</span>' +
    '<span class="dl-sub">' + esc(dir.sub||'') + '</span></div></div>';
}
function blocoBarrasH(b){
  const itens = b.itens || [];
  let max = 0; itens.forEach(i => { if (Number(i.valor) > max) max = Number(i.valor); });
  if (!max) max = 1;
  const temVar = itens.some(i => i.variacao);
  const linhas = itens.map(i => '<div class="dl-item"><span class="nm">' + esc(i.nome) + '</span>' +
    '<span class="tr"><span class="br" style="width:' + Math.max(1,(Number(i.valor)||0)/max*100).toFixed(1) + '%;background:' + esc(b.cor||'#22C3A7') + '"></span></span>' +
    '<span class="vl">' + rot(i.rotulo) + '</span>' +
    (temVar ? '<span class="vr ' + esc(i.tomVar||'neu') + '">' + rot(i.variacao||'') + '</span>' : '') + '</div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + '<div class="dl-itens">' + linhas + '</div></div>';
}
function blocoBarrasV(b){
  const itens = b.itens || [];
  let max = 0; itens.forEach(i => { if (Number(i.valor) > max) max = Number(i.valor); });
  if (!max) max = 1;
  const cols = itens.map(i => '<div class="dl-col"><span class="cv">' + rot(i.rotulo) + '</span>' +
    '<span class="cb" style="height:' + Math.max(2,(Number(i.valor)||0)/max*100).toFixed(1) + '%;background:' + esc(b.cor||'#22C3A7') + '"></span>' +
    '<span class="cn">' + esc(i.nome) + '</span></div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + '<div class="dl-cols">' + cols + '</div></div>';
}
function blocoMatriz(b){
  let pico = 0;
  (b.linhas||[]).forEach(l => (l.celulas||[]).forEach(c => { if (Number(c.valor) > pico) pico = Number(c.valor); }));
  if (!pico) pico = 1;
  const forte = b.cor || '#22C3A7', fraco = mistura('#0D1828', forte, 0.10);
  const cab = '<div class="dl-gl cab"><span class="dl-rh"></span>' +
    (b.colunas||[]).map(c => '<span class="dl-ch">' + esc(c) + '</span>').join('') + '</div>';
  const corpo = (b.linhas||[]).map(l => '<div class="dl-gl"><span class="dl-rh">' + esc(l.nome) + '</span>' +
    (l.celulas||[]).map(c => {
      const t = Math.pow(Math.max(Number(c.valor)||0,0)/pico, 0.62);
      const txt = t > 0.72 ? '#0D1828' : (t > 0.2 ? '#EDF2F9' : '#5B7091');
      return '<span class="dl-cel" style="background:' + mistura(fraco,forte,t) + ';color:' + txt + '">' + rot(c.rotulo) + '</span>';
    }).join('') + '</div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + '<div class="dl-grade">' + cab + corpo + '</div></div>';
}
function blocoLinha(b){
  const series = b.series || [], rx = b.rotulosX || [];
  let mn = Infinity, mx = -Infinity;
  series.forEach(s => (s.pontos||[]).forEach(p => { const v = Number(p); if (v < mn) mn = v; if (v > mx) mx = v; }));
  if (!isFinite(mn)){ mn = 0; mx = 1; }
  if (mn === mx){ mn -= 1; mx += 1; }
  const L = 1000, A = 300, pad = { e:8, d:8, t:16, b:34 };
  const x = i => pad.e + (rx.length > 1 ? i/(rx.length-1) : 0.5) * (L - pad.e - pad.d);
  const y = v => pad.t + (1 - (Number(v)-mn)/(mx-mn)) * (A - pad.t - pad.b);
  let svg = '<svg class="dl-svg" viewBox="0 0 ' + L + ' ' + A + '" preserveAspectRatio="none">';
  for (let g = 0; g <= 3; g++){
    const yy = pad.t + g*(A - pad.t - pad.b)/3;
    svg += '<line x1="' + pad.e + '" y1="' + yy + '" x2="' + (L-pad.d) + '" y2="' + yy + '" stroke="#22385A" stroke-width="1"/>';
  }
  series.forEach(s => {
    svg += '<polyline points="' + (s.pontos||[]).map((p,i) => x(i) + ',' + y(p)).join(' ') +
      '" fill="none" stroke="' + esc(s.cor||'#FF7A1A') + '" stroke-width="3"/>';
    (s.pontos||[]).forEach((p,i) => { svg += '<circle cx="' + x(i) + '" cy="' + y(p) + '" r="4" fill="' + esc(s.cor||'#FF7A1A') + '"/>'; });
  });
  rx.forEach((r,i) => { svg += '<text x="' + x(i) + '" y="' + (A-10) + '" fill="#5B7091" font-size="15" text-anchor="middle" font-family="Segoe UI">' + esc(r) + '</text>'; });
  svg += '</svg>';
  const leg = series.filter(s => s.nome).map(s => '<span><i style="background:' + esc(s.cor) + '"></i>' + esc(s.nome) + '</span>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + svg +
    (leg ? '<div class="dl-leg" style="margin-top:6px">' + leg + '</div>' : '') + '</div>';
}
function blocoRosca(b){
  const itens = b.itens || [];
  let soma = 0; itens.forEach(i => soma += Math.max(Number(i.valor)||0,0));
  if (!soma) soma = 1;
  const R = 60, C = 2*Math.PI*R;
  let acc = 0;
  const aneis = itens.map(i => {
    const frac = Math.max(Number(i.valor)||0,0)/soma;
    const el = '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + esc(i.cor||'#22C3A7') +
      '" stroke-width="34" stroke-dasharray="' + (frac*C).toFixed(2) + ' ' + C.toFixed(2) +
      '" stroke-dashoffset="' + (-acc*C).toFixed(2) + '" transform="rotate(-90 100 100)"/>';
    acc += frac; return el;
  }).join('');
  const c = b.centro || {};
  const svg = '<svg viewBox="0 0 200 200" style="height:100%;flex:none">' + aneis +
    (c.valor ? '<text x="100" y="98" fill="#EDF2F9" font-size="30" font-weight="600" text-anchor="middle" font-family="Segoe UI">' + esc(c.valor) + '</text>' : '') +
    (c.rot ? '<text x="100" y="122" fill="#93A8C4" font-size="15" text-anchor="middle" font-family="Segoe UI">' + esc(c.rot) + '</text>' : '') + '</svg>';
  const leg = itens.map(i => '<div class="dl-ll"><i style="width:12px;height:12px;background:' + esc(i.cor||'#22C3A7') + ';flex:none"></i>' +
    '<span class="r">' + esc(i.nome) + '</span><span class="v">' + rot(i.rotulo) + '</span></div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) +
    '<div style="flex:1;display:flex;gap:20px;min-height:0;align-items:center">' + svg +
    '<div class="dl-lista" style="flex:1">' + leg + '</div></div></div>';
}
function blocoTabela(b){
  const al = b.alinhamentos || [];
  const cab = '<div class="dl-tl cab">' + (b.colunas||[]).map((c,i) =>
    '<span' + (al[i]==='dir'?' class="dir"':'') + '>' + esc(c) + '</span>').join('') + '</div>';
  const corpo = (b.linhas||[]).map(l => '<div class="dl-tl">' + l.map((c,i) => {
    const o = (c && typeof c === 'object') ? c : { texto:c };
    return '<span' + (al[i]==='dir'?' class="dir"':'') + ' style="color:' + tomCor(o.tom) + '">' + rot(o.texto) + '</span>';
  }).join('') + '</div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + '<div class="dl-tab">' + cab + corpo + '</div></div>';
}
function blocoLista(b){
  const itens = (b.itens||[]).map(i => '<div class="dl-ll"><span class="r">' + esc(i.rot) + '</span><span class="v">' + rot(i.vl) + '</span></div>').join('');
  return '<div class="dl-card" style="flex:' + (b.peso||1) + '">' + tit(b) + '<div class="dl-lista">' + itens + '</div></div>';
}
const BLOCOS = { kpi:blocoKpi, meta:blocoMeta, barrasH:blocoBarrasH, barrasV:blocoBarrasV,
                 matriz:blocoMatriz, linha:blocoLinha, rosca:blocoRosca, tabela:blocoTabela, lista:blocoLista };

function renderPainel(spec){
  const id = (spec.identidade && IDENT[spec.identidade]) ? spec.identidade : '#FF7A1A';
  const faixas = (spec.faixas||[]).map(f => '<div class="dl-faixa" style="flex:' + (f.peso||1) + '">' +
    (f.blocos||[]).map(b => (BLOCOS[b.tipo] || blocoLista)(b)).join('') + '</div>').join('');
  return '<div class="dl" style="--id:' + id + '">' +
    '<div class="dl-rail"></div>' +
    '<header class="dl-head"><span class="dl-logo"><i></i></span>' +
    '<span><span class="dl-marca">' + esc(spec.marca||'') + '</span><br><span class="dl-pagina">' + esc(spec.pagina||'') + '</span></span>' +
    '<span class="dl-head-dir">' +
      (spec.atualizado ? '<span class="dl-atu">Atualizado em <b>' + esc(spec.atualizado) + '</b></span>' : '') +
      (spec.chip ? '<span class="dl-chipmes">' + esc(spec.chip) + '</span>' : '') +
    '</span></header><div class="dl-corpo">' + faixas + '</div></div>';
}
const contarFaltas = o => (JSON.stringify(o).match(/"\?"/g) || []).length;

/* ─────────── dados ─────────── */
let dados = { versao:1, atualizadoEm:'', paineis:[] };
let origem = '';
const $ = id => document.getElementById(id);

function falar(t){
  const r = $('recado'); r.textContent = t; r.classList.add('visivel');
  clearTimeout(falar.t); falar.t = setTimeout(() => r.classList.remove('visivel'), 2800);
}

async function buscar(silencioso){
  try{
    const r = await fetch('paineis.json?v=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!j.paineis || !j.paineis.length) throw new Error('sem painéis');
    dados = j; origem = 'site';
    montar();
    if (!silencioso) falar('Dados atualizados do site.');
  } catch(e){
    if (!origem){ origem = 'falhou'; montar(); }
    if (!silencioso) falar('Não consegui buscar paineis.json: ' + (e.message||e));
  }
}

function montar(){
  const grade = $('grade');
  grade.innerHTML = '';
  const lista = dados.paineis || [];

  if (!lista.length){
    grade.innerHTML = '<div class="vazio"><h2>Nenhum painel publicado ainda</h2>' +
      '<p>Peça ao Claude para ler os prints do Power BI e devolver o conteúdo do <code>paineis.json</code>. ' +
      'Depois clique em <b>ver / colar dados</b>, cole o conteúdo e publique o arquivo no site.</p></div>';
  }

  lista.forEach((p,i) => {
    const el = document.createElement('article');
    el.className = 'cartao';
    el.style.setProperty('--cor', p.cor || '#FF7A1A');
    const m = document.createElement('div');
    m.className = 'moldura';
    const cx = document.createElement('div');
    cx.className = 'mini';
    cx.innerHTML = renderPainel(p.spec || {});
    m.appendChild(cx);
    m.insertAdjacentHTML('beforeend','<span class="indice">' + (i+1) + '</span>');
    el.appendChild(m);
    el.insertAdjacentHTML('beforeend',
      '<div class="rodape"><i class="tag"></i><span class="nome">' + esc(p.nome||'') + '</span>' +
      '<span class="tempo">' + (p.segundos||20) + 's</span></div>');
    grade.appendChild(el);
    requestAnimationFrame(() => { cx.style.transform = 'scale(' + (m.clientWidth/1920) + ')'; });
  });

  $('ciclo').textContent = lista.reduce((s,p) => s + (p.segundos||20), 0) + 's';
  $('btExibir').disabled = !lista.length;

  const faltas = contarFaltas(dados);
  const av = $('aviso');
  av.classList.remove('alerta');
  if (origem === 'falhou'){
    av.classList.add('alerta');
    $('avisoTexto').innerHTML = '<b>Não achei o paineis.json.</b> Abrindo direto do arquivo isso é normal — publique a pasta ou use <b>ver / colar dados</b>.';
  } else if (faltas){
    av.classList.add('alerta');
    $('avisoTexto').innerHTML = '<b>' + faltas + ' valor marcado com ?</b> — precisa ser preenchido à mão antes de exibir.';
  } else {
    $('avisoTexto').innerHTML = lista.length + ' painéis publicados' +
      (dados.atualizadoEm ? ' · dados de <b>' + esc(dados.atualizadoEm) + '</b>' : '') +
      ' · a página busca atualização a cada ' + OPCOES.buscarACadaMin + ' min.';
  }
}

/* ─────────── gaveta ─────────── */
$('btDados').onclick = () => { $('json').value = JSON.stringify(dados, null, 2); $('erro').style.display='none'; $('gaveta').classList.add('aberta'); };
$('btFechar').onclick = () => $('gaveta').classList.remove('aberta');
$('gaveta').addEventListener('click', e => { if (e.target.id === 'gaveta') $('gaveta').classList.remove('aberta'); });
$('btCopiar').onclick = async () => {
  try { await navigator.clipboard.writeText($('json').value); falar('Copiado. Cole no paineis.json do site e salve.'); }
  catch(e){ $('json').select(); falar('Pressione Ctrl+C para copiar.'); }
};
$('btAplicar').onclick = () => {
  try{
    const j = JSON.parse($('json').value);
    if (!j.paineis || !j.paineis.length) throw new Error('faltam "paineis"');
    dados = j; origem = 'colado'; montar();
    $('gaveta').classList.remove('aberta');
    falar('Aplicado só nesta tela. Para todo mundo ver, publique no site.');
  } catch(err){ const e = $('erro'); e.textContent = 'JSON inválido: ' + err.message; e.style.display = 'block'; }
};
$('btRecarregar').onclick = () => { $('gaveta').classList.remove('aberta'); buscar(); };
$('btAtualizar').onclick = () => buscar();
setInterval(() => buscar(true), OPCOES.buscarACadaMin * 60000);

/* ─────────── exibição ─────────── */
const palco = $('palco'), camadas = $('camadas'), avanco = $('avanco'), etiqueta = $('etiqueta');
let fila = [], atual = 0, t0 = 0, decorrido = 0, raf = null, tEt = null;
const exibindo = () => document.body.classList.contains('exibindo');

function escala(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  let dx = 0, dy = 0;
  if (OPCOES.antiBurnIn){
    const f = Date.now()/420000 * Math.PI * 2;
    dx = Math.round(Math.sin(f)*3); dy = Math.round(Math.cos(f*0.73)*3);
  }
  palco.style.transform = 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
}
addEventListener('resize', () => {
  if (exibindo()) escala();
  else document.querySelectorAll('.moldura').forEach(m => {
    const c = m.querySelector('.mini'); if (c) c.style.transform = 'scale(' + (m.clientWidth/1920) + ')';
  });
});
setInterval(() => { if (exibindo()) escala(); }, 20000);

async function exibir(){
  fila = (dados.paineis||[]).slice();
  if (!fila.length) return;
  camadas.innerHTML = ''; $('etPontos').innerHTML = '';
  fila.forEach(p => {
    const c = document.createElement('div');
    c.className = 'camada';
    c.innerHTML = renderPainel(p.spec || {});
    camadas.appendChild(c);
    const d = document.createElement('i'); d.className = 'ponto'; $('etPontos').appendChild(d);
  });
  $('controle').style.display = 'none';
  $('exibicao').classList.add('ligada');
  document.body.classList.add('exibindo');
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  try { if ('wakeLock' in navigator) exibir.trava = await navigator.wakeLock.request('screen'); } catch(e){}
  escala(); ir(0); cancelAnimationFrame(raf); girar();
}
function encerrar(){
  cancelAnimationFrame(raf); raf = null; clearTimeout(tEt);
  try { if (exibir.trava){ exibir.trava.release(); exibir.trava = null; } } catch(e){}
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('exibicao').classList.remove('ligada');
  document.body.classList.remove('exibindo');
  $('controle').style.display = 'flex';
  montar();
}
function ir(i){
  atual = (i + fila.length) % fila.length;
  const p = fila[atual];
  [...camadas.children].forEach((c,k) => c.classList.toggle('ativa', k === atual));
  [...$('etPontos').children].forEach((d,k) => d.classList.toggle('aceso', k === atual));
  avanco.style.background = p.cor || '#FF7A1A';
  $('etMarca').style.background = p.cor || '#FF7A1A';
  $('etNome').textContent = p.nome || '';
  $('etData').textContent = (p.spec && p.spec.atualizado) ? 'dados de ' + p.spec.atualizado : '';
  etiqueta.classList.add('visivel');
  clearTimeout(tEt);
  tEt = setTimeout(() => etiqueta.classList.remove('visivel'), OPCOES.etiquetaSegundos*1000);
  decorrido = 0; t0 = performance.now();
}
function girar(){
  raf = requestAnimationFrame(girar);
  const a = performance.now(); decorrido += a - t0; t0 = a;
  const dur = (fila[atual].segundos || 20) * 1000;
  avanco.style.width = Math.min(100, decorrido/dur*100) + '%';
  if (decorrido >= dur) ir(atual+1);
}
$('btExibir').onclick = exibir;
addEventListener('keydown', e => {
  if (!exibindo()) return;
  if (e.key === 'ArrowRight') ir(atual+1);
  else if (e.key === 'ArrowLeft') ir(atual-1);
  else if (e.key === 'Escape') encerrar();
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && exibindo()) encerrar(); });
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && exibindo()){
    try { if ('wakeLock' in navigator) exibir.trava = await navigator.wakeLock.request('screen'); } catch(e){}
  }
});

/* auto: ?tv=1 no link já entra em exibição */
buscar(true).then(() => {
  if (new URLSearchParams(location.search).get('tv') === '1' && (dados.paineis||[]).length){
    $('btExibir').textContent = 'Clique para iniciar na TV';
  }
});
</script>
</body>
</html>
